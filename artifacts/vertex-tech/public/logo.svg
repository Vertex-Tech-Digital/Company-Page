<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vertex Tech">
  <defs>
    <linearGradient id="vtBg" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13243f"/>
      <stop offset="1" stop-color="#0a1426"/>
    </linearGradient>
    <linearGradient id="vtStroke" x1="60" y1="55" x2="135" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fd0ff"/>
      <stop offset="0.55" stop-color="#3b9bff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="vtGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon plate -->
  <path d="M100 8 L180 54 L180 146 L100 192 L20 146 L20 54 Z"
        fill="url(#vtBg)"/>
  <path d="M100 8 L180 54 L180 146 L100 192 L20 146 L20 54 Z"
        fill="none" stroke="#33507f" stroke-opacity="0.5" stroke-width="3" stroke-linejoin="round"/>

  <!-- VT circuit traces -->
  <g filter="url(#vtGlow)" stroke="url(#vtStroke)" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- V -->
    <path d="M50 60 L94 150 L120 92"/>
    <!-- T bar -->
    <path d="M98 60 L152 60"/>
    <!-- T stem -->
    <path d="M126 60 L126 134"/>
  </g>

  <!-- circuit nodes -->
  <g fill="url(#vtStroke)" filter="url(#vtGlow)">
    <circle cx="152" cy="60" r="6.5"/>
    <circle cx="94" cy="150" r="6.5"/>
    <circle cx="126" cy="134" r="6.5"/>
    <circle cx="71" cy="105" r="5.5"/>
  </g>
</svg>
